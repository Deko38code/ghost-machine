<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Ubuntu Sans","Ubuntu","Noto Sans",sans-serif;background:#08080A}
.ad{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 620px at 86% 4%,  rgba(255,209,0,.20), transparent 62%),
    radial-gradient(820px 700px at -6% 108%, rgba(255,178,0,.10), transparent 60%),
    radial-gradient(1400px 900px at 50% 50%, rgba(255,255,255,.020), transparent 70%),
    #08080A;}
/* depth: vignette + fine dot grid */
.ad:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 105% at 50% 45%, transparent 48%, rgba(0,0,0,.45) 100%)}
.ad:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.075) 1px, transparent 1.4px);
  background-size:26px 26px}
.edge{position:absolute;top:0;left:0;right:0;height:2px;z-index:6;
  background:linear-gradient(90deg,transparent 8%,rgba(255,209,0,.9) 50%,transparent 92%)}
header{display:flex;flex-direction:column;padding:40px 52px 0;position:relative;z-index:5}
.brand{font-weight:800;font-size:35px;letter-spacing:-.025em;color:#fff;line-height:1;
  text-shadow:0 2px 18px rgba(0,0,0,.55)}
.brand em{font-style:normal;color:#FFD100}
.brand small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.235em;
  color:#8A8A96;margin-top:9px}
main{flex:1;display:flex;position:relative;z-index:5;min-height:0}
.txt{display:flex;flex-direction:column;justify-content:center;min-width:0}
.eyebrow{display:inline-block;align-self:flex-start;font-size:12.5px;font-weight:800;letter-spacing:.21em;
  color:#0A0A0C;background:linear-gradient(180deg,#FFDA33,#FFC300);padding:8px 15px;border-radius:6px;
  margin-bottom:20px;box-shadow:0 6px 22px rgba(255,209,0,.30)}
h1{font-weight:800;letter-spacing:-.032em;line-height:.99;color:#fff;
  text-shadow:0 4px 30px rgba(0,0,0,.6)}
h1 b{color:#FFD100;font-weight:800}
.sub{color:#ABABB6;font-weight:500;margin-top:17px;line-height:1.45}
.stats{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}
.chip{border:1px solid rgba(255,209,0,.30);background:rgba(255,209,0,.065);color:#FFE070;
  font-weight:700;font-size:15px;padding:10px 16px;border-radius:999px;white-space:nowrap}
.cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;margin-top:28px;
  background:linear-gradient(180deg,#FFDC40,#FFC200);color:#0A0A0C;font-weight:800;font-size:19.5px;
  letter-spacing:.005em;padding:18px 36px;border-radius:999px;
  box-shadow:0 16px 44px rgba(255,204,0,.42), 0 2px 0 rgba(255,255,255,.30) inset}
.cta i{font-style:normal;font-size:22px;line-height:1}
/* badge anchored on a spotlight so it doesn't float */
.mark2{display:flex;align-items:center;justify-content:center;position:relative}
.mark2:before{content:"";position:absolute;width:112%;height:112%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,0,.20) 0%, rgba(255,209,0,.07) 45%, transparent 70%)}
.mark2 img{position:relative;width:100%;height:auto;object-fit:contain;
  filter:drop-shadow(0 20px 60px rgba(255,209,0,.46)) drop-shadow(0 2px 6px rgba(0,0,0,.5))}
footer{display:flex;align-items:center;gap:15px;padding:0 52px;height:78px;flex:0 0 78px;
  border-top:1px solid rgba(255,255,255,.085);position:relative;z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008))}
.pwr{font-size:11px;font-weight:800;letter-spacing:.20em;color:#71717E}
footer .lg{width:37px;height:37px;object-fit:contain;border-radius:8px}
footer .nm{font-size:16px;font-weight:800;color:#E4E4EC;letter-spacing:.005em}
footer .sep{width:1px;height:30px;background:rgba(255,255,255,.17);margin:0 7px}
footer .gh{font-size:22px;line-height:1}
footer .url{font-size:13.5px;font-weight:600;color:#71717E;margin-left:3px}
/* ── landscape ── */
.land main{flex-direction:row;align-items:center;gap:38px;padding:0 52px}
.land .txt{flex:1 1 auto}
.land .mark2{flex:0 0 366px}
.land .mark2 img{width:352px}
.land h1{font-size:65px;max-width:13em}
.land .sub{font-size:20.5px;max-width:17em}

/* ── square ── */
.sq main{flex-direction:column-reverse;align-items:center;justify-content:center;
  padding:0 76px;gap:0}
.sq header{align-items:center;padding-top:38px}
.sq .txt{align-items:center;text-align:center;flex:0 1 auto}
.sq .eyebrow{align-self:center;margin-bottom:22px}
.sq .mark2{display:flex;flex:0 0 auto;margin-bottom:20px}
.sq .mark2 img{width:274px}
.sq h1{font-size:78px}
.sq .sub{font-size:23px;max-width:20em;margin-top:19px}
.sq .stats{justify-content:center;margin-top:28px}
.sq .chip{font-size:17.5px;padding:12px 20px}
.sq .cta{align-self:center;font-size:23px;padding:21px 48px;margin-top:34px}
.sq .split{display:none}
.sq footer{justify-content:center;height:80px;flex:0 0 80px;padding:0 40px}
.sq footer .lg{width:40px;height:40px}
.sq footer .nm{font-size:17.5px}
</style></head><body>
<div class="ad sq"><div class="edge"></div>
  <header><div class="brand">Rent My <em>Trailer</em><small>LOCAL OWNERS · NATIONWIDE</small></div></header>
  <main>
    <div class="txt">
      <div class="eyebrow">DUMP TRAILERS</div>
      <h1>1,621 dump trailers,<br><b>listed near you.</b></h1>
      <p class="sub">Skip the rental counter.<br>Book from a local owner.</p>
      <div class="stats"><span class="chip">from local owners</span><span class="chip">avg $119/day</span><span class="chip">delivery in many areas</span></div>
      <div class="cta">BROWSE DUMP TRAILERS <i>&#8594;</i></div>
    </div>
    <div class="mark2"><img src="assets/rmt-logo.webp" alt="Rent My Trailer"></div>
  </main>
  <footer>
    <span class="pwr">POWERED&nbsp;BY</span>
    <img class="lg" src="assets/haksterai-logo.png" alt="HaksterAI">
    <span class="nm">HaksterAI</span>
    <span class="sep"></span>
    <span class="gh">&#128123;</span>
    <span class="nm">PHANTOM IDE</span>
    <span class="url">phantomide.com</span>
  </footer>
</div></body></html>
