<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="/style.css"/><title>Orebolt Pool</title>
<style>
:root{--bg:#070a14;--card:rgba(16,24,40,.72);--line:rgba(255,255,255,.08);--gold:#f7a935;--text:#e5edf8;--dim:#9aa5b6}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1080px;margin:0 auto;padding:0 20px 40px}nav{display:flex;align-items:center;gap:16px;padding:18px 0}.logo{font-weight:800;letter-spacing:.05em}.logo span{color:var(--gold)}.pill{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}.hero{padding:50px 0 30px;text-align:center}.hero h1{margin:0 0 12px;font-size:clamp(1.9rem,4.5vw,2.8rem)}.hero p{margin:0 auto 22px;max-width:620px;color:var(--dim);line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:20px 0}.card h3{margin:0 0 8px;color:var(--gold)}.card p{color:var(--dim);font-size:.9rem;margin:0}
</style></head>
<body><div class="wrap">
<nav><div class="logo">Ore<span>bolt</span></div><span class="pill">Pool</span></nav>
<section class="hero"><h1>Pool status</h1><p>The pool is not configured yet. Once a real pool API is added, this page will show the live status.</p></section>
<div id="status" class="card"><h3>Status</h3><p>Loading...</p></div>
<footer style="border-top:1px solid var(--line);margin-top:40px;padding:18px 0;color:var(--dim);text-align:center">© Orebolt — honest status.</footer>
</div>
<script>
(async () => {
  const el = document.getElementById('status');
  const r = await fetch('/api/pool/stats');
  const j = await r.json();
  el.querySelector('h3').textContent = j.ok ? 'Connected' : 'Not configured';
  el.querySelector('p').textContent = j.ok ? 'Live pool data is available.' : 'Add real pool provider, apiUrl, and apiToken in data/pool.json.';
})();
</script>
<script src="/site.js"></script><script src="/menu.js"></script></body></html>
