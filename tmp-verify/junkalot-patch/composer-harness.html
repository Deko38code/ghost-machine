<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-950 p-4">
<div id="wrap" class="max-w-6xl mx-auto">
<div class="sticky bottom-0 z-30 -mx-4 -mb-4 flex flex-col gap-3 border-t border-green-900/70 bg-gray-950/95 px-4 py-3 font-mono backdrop-blur sm:flex-row sm:items-end">
  <span class="shrink-0 text-xs text-green-500 sm:order-1 sm:pb-3">susie@junkalot:~$</span>
  <textarea aria-label="msg" rows="4" placeholder="Ask Mr Ed about your site or a reply…"
    class="sm:order-3 w-full min-w-0 flex-1 resize-y overflow-y-auto rounded-lg border border-green-950 bg-gray-950/60 p-3 text-white outline-none placeholder-gray-600 focus:border-green-700 min-h-32 max-h-96 text-base leading-6"></textarea>
  <div class="flex w-full items-center justify-between gap-2 sm:contents">
    <button type="button" id="mic" aria-label="Talk to text"
      class="min-h-[40px] min-w-[44px] shrink-0 self-end rounded border px-3 py-2 text-sm font-bold disabled:opacity-30 sm:order-2 border-green-800 bg-green-900/40 text-green-400 hover:bg-green-800/40"><span aria-hidden="true">🎤</span></button>
    <button id="send" class="shrink-0 self-end rounded border border-green-800 bg-green-900/40 px-4 py-2 text-xs font-bold text-green-400 hover:bg-green-800/40 disabled:opacity-30 sm:order-4">SEND</button>
  </div>
</div></div></body></html>
